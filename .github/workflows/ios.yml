name: Build iOS app (simulator check)
on: { workflow_dispatch: {} }
jobs:
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Compile for the simulator (proves the project builds; App Store upload needs your Apple account)
        run: cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
