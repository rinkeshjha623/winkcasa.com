<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinkCasa cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@500&display=swap"><link rel="stylesheet" href="brand.css">
<style>.row{position:relative;width:92vw;height:56vh;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:4vw}
.eb{font-size:1.5vh;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;margin-bottom:2.2vh}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:8.2vh;line-height:1.02}h1 em{color:var(--gold)}
.sub{margin-top:2.6vh;font-size:2.1vh;color:var(--muted);letter-spacing:.04em}
.pills{display:flex;gap:1.4vh 1.6vw;flex-wrap:wrap;margin-top:3vh}.pills span{border:1px solid rgba(201,164,92,.5);padding:1vh 1.3vw;font-size:1.5vh;letter-spacing:.2em;text-transform:uppercase;color:var(--ivory)}
.col{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;align-items:end;height:100%}
.col .arch:nth-child(1){height:78%}.col .arch:nth-child(2){height:100%}.col .arch:nth-child(3){height:64%}
.url{position:absolute;right:0;bottom:-4.6vh;font-size:1.7vh;letter-spacing:.3em;color:var(--gold)}
svg{width:3.4vh;color:var(--gold);vertical-align:middle;margin-right:1vh}</style></head>
<body><div class="stage"><div class="glow"></div><div class="row"><div>
<div class="eb"><svg viewBox="0 0 48 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9q19 17 38 0"/><path d="M9 13 4 19M16 17l-3 7M24 19v8M32 17l3 7M39 13l5 6"/></svg>WinkCasa · New Delhi</div>
<h1>Everyday jewellery, <em>chosen with care.</em></h1><p class="sub">Earrings · Necklaces · Hair accessories · Beauty tools</p>
<div class="pills"><span>Free delivery above ₹999</span><span>UPI · Cards · Net banking</span></div></div>
<div class="col" id="col"></div><div class="url">WWW.WINKCASA.COM</div></div></div>
<script>fetch('/api/catalog').then(r=>r.json()).then(d=>{const l=(Array.isArray(d)?d:d.products).filter(p=>p.image);const pick=[l.find(p=>p.id==18),l.find(p=>p.id==24)||l[3],l.find(p=>/claw/i.test(p.name))||l[5]];document.getElementById('col').innerHTML=pick.filter(Boolean).map(p=>`<div class="arch"><img src="${p.image}" alt=""></div>`).join('')})</script></body></html>
